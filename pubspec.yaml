name: lifes_game
description: "Habit-Tracker mit rundenbasiertem RPG"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Kampflogik. Reines Dart, ohne Flutter- oder Flame-Abhaengigkeit.
  # Siehe ADR-0002 und ADR-0003.
  combat:
    path: packages/combat

  # Theorie-Inhalte und Lernfortschritt. Ebenfalls reines Dart, damit
  # Lektionen ohne laufende App geschrieben und geprueft werden koennen
  # (ADR-0004).
  theory:
    path: packages/theory

  # Levelkurve. Entscheidet, welche Theoriezweige offen sind (ADR-0006).
  progression:
    path: packages/progression

  # Gewohnheiten, Streaks und die daraus folgenden Charakterwerte. Reines
  # Dart, damit sich Streak- und Statkurven durchrechnen lassen (ADR-0008).
  habits:
    path: packages/habits

  # Ausruestung, Preise und Inventar. Der einzige Gold-Abfluss des Spiels
  # (ADR-0011).
  gear:
    path: packages/gear

  # Name und verdiente Titel. Reines Dart, damit sich die
  # Titelbedingungen ohne laufende App pruefen lassen (ADR-0013).
  identity:
    path: packages/identity

  # State Management (ADR-0001).
  flutter_riverpod: ^3.0.1

  # Persistenz. Bewusst nicht Drift: Zu speichern sind drei
  # Schluessel-Wert-Paare, kein relationales Modell -- und auf Web braucht
  # Drift zusaetzlich sqlite3.wasm plus Worker als Assets. Der
  # Speicher-Anschluss in `lib/save/` ist so geschnitten, dass Drift
  # spaeter dahinter passt, ohne dass ein Controller sich aendert
  # (ADR-0010).
  shared_preferences: ^2.3.0

  # Game-Engine. Ausschliesslich fuer den Kampfbildschirm, eingebettet als
  # Widget -- nicht fuer die Tracker-Screens.
  flame: ^1.34.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
