name: action_combat
description: >-
  Echtzeit-Kampf als Prototyp: eine Halle voller Gegner, ein Endgegner am
  Ende. Reines Dart mit festem Zeitschritt, damit sich ein ganzer Lauf ohne
  Renderer durchspielen laesst -- dieselbe Naht wie bei package:combat
  (ADR-0002).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

# Bewusst leer, wie bei den anderen acht Packages. Ein Echtzeit-Kampf
# braucht keine Engine, nur Zahlen und einen festen Zeitschritt -- und ein
# leerer Block macht die Schichtregel erzwingbar statt nur vereinbart
# (ADR-0003). Ein Flame-Import schlaegt hier schlicht fehl.
dependencies:

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
