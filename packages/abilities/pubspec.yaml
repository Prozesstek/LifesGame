name: abilities
description: >-
  Welche Faehigkeit woher kommt und wann sie offen ist. Reines Dart, damit
  sich die Freischaltbedingungen gegen den Fortschritt durchrechnen lassen,
  ohne die App zu starten (siehe ADR-0017).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

# Bewusst leer, wie bei den anderen sechs Packages. Dieses Package kennt
# weder `combat` noch `gear` noch `habits` -- es haelt nur Ids und
# Bedingungen. Der leere Block macht die Schichtregel aus CLAUDE.md
# erzwingbar statt nur vereinbart (ADR-0003).
dependencies:

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
